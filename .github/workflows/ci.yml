name: CI

# The local gate (CLAUDE.md), run on every pull request and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx vue-tsc -b

      # eslint.config.js: hardcoded UI strings; the existing backlog is capped
      # by --max-warnings in package.json.
      - name: Lint (i18n)
        run: npm run lint:i18n

      - name: Unit tests
        run: npx vitest run

      # Production dependencies must stay free of high/critical advisories.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npx vite build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app and serves it with `vite preview`;
      # the specs mock every API call, so no backend is needed.
      - name: Run e2e suite
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
